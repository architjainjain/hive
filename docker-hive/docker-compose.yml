# Hive local test cluster
# Services: Postgres, HDFS (NN+3×DN), YARN (RM+3×NM), Hive Metastore, HiveServer2
#
# UIs:
#   HDFS NameNode:         http://localhost:9870
#   YARN ResourceManager:  http://localhost:8088
#   HiveServer2:           http://localhost:10002
#
# Connect with Beeline:
#   docker exec -it hive-local-hiveserver2 beeline -u 'jdbc:hive2://localhost:10000/' -n root

name: hive-local

services:

  postgres:
    image: postgres:17.2-bookworm
    container_name: hive-local-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - hive-local-pgdata:/var/lib/postgresql/data
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  namenode:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-namenode
    hostname: namenode
    restart: unless-stopped
    environment:
      SERVICE_NAME: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hive-local-namenode:/opt/hadoop/data/namenode
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus' | grep -q active"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  datanode:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-datanode
    hostname: datanode
    restart: unless-stopped
    environment:
      SERVICE_NAME: datanode
    ports:
      - "9864:9864"
    volumes:
      - hive-local-datanode:/opt/hadoop/data/datanode
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9864"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  datanode2:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-datanode2
    hostname: datanode2
    restart: unless-stopped
    environment:
      SERVICE_NAME: datanode
    volumes:
      - hive-local-datanode2:/opt/hadoop/data/datanode
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  datanode3:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-datanode3
    hostname: datanode3
    restart: unless-stopped
    environment:
      SERVICE_NAME: datanode
    volumes:
      - hive-local-datanode3:/opt/hadoop/data/datanode
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  resourcemanager:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-resourcemanager
    hostname: resourcemanager
    restart: unless-stopped
    environment:
      SERVICE_NAME: resourcemanager
    ports:
      - "8088:8088"
      - "8032:8032"
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8088/ws/v1/cluster/info' | grep -q STARTED"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  nodemanager:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-nodemanager
    hostname: nodemanager
    restart: unless-stopped
    environment:
      SERVICE_NAME: nodemanager
    ports:
      - "8042:8042"
    depends_on:
      resourcemanager:
        condition: service_healthy
    networks:
      - hive-local
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8042/ws/v1/node/info' | grep -q nodeHealthy"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  nodemanager2:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-nodemanager2
    hostname: nodemanager2
    restart: unless-stopped
    environment:
      SERVICE_NAME: nodemanager
    depends_on:
      resourcemanager:
        condition: service_healthy
    networks:
      - hive-local
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8042/ws/v1/node/info' | grep -q nodeHealthy"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  nodemanager3:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-nodemanager3
    hostname: nodemanager3
    restart: unless-stopped
    environment:
      SERVICE_NAME: nodemanager
    depends_on:
      resourcemanager:
        condition: service_healthy
    networks:
      - hive-local
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8042/ws/v1/node/info' | grep -q nodeHealthy"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  metastore:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-metastore
    hostname: metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      SERVICE_OPTS: >-
        -Xmx512m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=password
    ports:
      - "9083:9083"
    volumes:
      - hive-local-scratch:/opt/hive/scratch
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_healthy
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  hiveserver2:
    image: hive-local:4.3.0-SNAPSHOT
    container_name: hive-local-hiveserver2
    hostname: hiveserver2
    restart: unless-stopped
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      DB_DRIVER: postgres
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.uris=thrift://metastore:9083
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=password
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - hive-local-scratch:/opt/hive/scratch
    depends_on:
      metastore:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    networks:
      - hive-local
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10000"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  hive-local-pgdata:
  hive-local-namenode:
  hive-local-datanode:
  hive-local-datanode2:
  hive-local-datanode3:
  hive-local-scratch:

networks:
  hive-local:
    name: hive-local
